<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recibido · Sergio García</title>
<meta name="robots" content="noindex">
<style>
  :root {
    --bg: #F6F7F9; --surface: #FFFFFF; --ink: #14202A; --muted: #61707E;
    --line: #DCE2E8; --accent: #0B6E62;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0F151A; --surface: #161E25; --ink: #E7EDF2; --muted: #94A2AE;
      --line: #27323B; --accent: #43BCAA;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0F151A; --surface: #161E25; --ink: #E7EDF2; --muted: #94A2AE;
    --line: #27323B; --accent: #43BCAA;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: var(--sans); line-height: 1.5;
    min-height: 100vh; display: grid; place-items: center; padding: 24px;
  }
  .card {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 12px; padding: 34px 28px; max-width: 460px; text-align: center;
    box-shadow: 0 1px 2px rgba(20,32,42,.06), 0 8px 24px rgba(20,32,42,.06);
  }
  .mark {
    width: 46px; height: 46px; margin: 0 auto 18px; border-radius: 50%;
    background: var(--accent); display: grid; place-items: center;
  }
  .mark svg { width: 24px; height: 24px; }
  h1 { font-size: 1.5rem; margin: 0 0 10px; letter-spacing: -.02em; text-wrap: balance; }
  p { color: var(--muted); margin: 0 0 8px; }
  a { color: var(--accent); font-weight: 600; }
</style>
</head>
<body>
  <div class="card">
    <div class="mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 12.5l5.5 5.5L20 6"/>
      </svg>
    </div>
    <h1>Recibido, gracias</h1>
    <p>Te contesto en menos de 24 horas con el presupuesto cerrado y por escrito.</p>
    <p>Si te corre prisa, llámame directamente al <a href="tel:+34620650597">620 650 597</a>.</p>
  </div>
</body>
</html>

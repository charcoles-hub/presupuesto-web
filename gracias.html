<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recibido · Sergio García Ortiz</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..900&display=swap" rel="stylesheet">
<style>
  /* Mismos tokens que el portfolio y que la calculadora. */
  :root {
    --bg:     oklch(0.155 0.006 260);
    --line:   oklch(0.255 0.01 260);
    --ink:    oklch(0.96 0.004 90);
    --muted:  oklch(0.67 0.012 260);
    --accent: oklch(0.68 0.2 35);
    --sans: "Archivo", ui-sans-serif, system-ui, sans-serif;
    --muelle: linear(
      0, 0.009, 0.035 2.1%, 0.141 4.4%, 0.723 12.9%, 0.938 16.7%, 1.017,
      1.077, 1.121, 1.149 24.3%, 1.159, 1.163, 1.161, 1.154 29.9%, 1.129 32.8%,
      1.051 39.6%, 1.017 43.1%, 0.991, 0.977 51%, 0.974 53.8%, 0.975 57.1%,
      0.997 69.8%, 1.003 76.9%, 1
    );
  }
  * { box-sizing: border-box; }
  html { background: var(--bg); }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: var(--sans); line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    min-height: 100svh; display: grid; place-items: center; padding: 24px;
  }
  .caja { display: flex; flex-direction: column; align-items: flex-start; gap: 20px; max-width: 46ch; }
  .marca {
    display: grid; place-items: center;
    width: 48px; height: 48px; border-radius: 999px;
    background: var(--accent); color: var(--bg);
    font-size: 1.5rem; font-weight: 800;
  }
  h1 {
    font-size: clamp(2rem, 1.4rem + 3vw, 3.4rem);
    font-weight: 800; font-stretch: 110%;
    line-height: .95; letter-spacing: -.04em; margin: 0; text-wrap: balance;
  }
  p { color: var(--muted); margin: 0; text-wrap: pretty; }
  p + p { margin-top: -8px; }
  a.tel { color: var(--ink); text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 4px; }
  a.tel:hover { text-decoration-color: var(--accent); }
  .boton {
    display: inline-flex; align-items: center; gap: .5ch;
    border: 1px solid var(--line); border-radius: 999px;
    padding: .72rem 1.15rem; font-size: .8rem; font-weight: 600;
    color: var(--ink); text-decoration: none;
    transition: transform .5s var(--muelle), border-color .2s ease;
  }
  .boton:hover { transform: translateY(-2px); border-color: var(--accent); }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
  <div class="caja">
    <span class="marca" aria-hidden="true">✓</span>
    <h1>Recibido. Te contesto hoy.</h1>
    <p>Te llega el presupuesto cerrado y por escrito en menos de 24 horas, sin compromiso.</p>
    <p>Si te corre prisa, llámame directamente al <a class="tel" href="tel:+34620650597">620 650 597</a>.</p>
    <a class="boton" href="https://charcoles-hub.github.io/">← Ver el trabajo</a>
  </div>
</body>
</html>
